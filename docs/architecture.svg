<svg viewBox="0 0 980 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect width="980" height="900" fill="#f7f8fa"/>

  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2430">Data Analysis Chatbot — Architecture</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Busy Accounting Software + Groq (openai/gpt-oss-120b)</text>

  <!-- User -->
  <rect x="400" y="85" width="180" height="46" rx="10" fill="#2d3748"/>
  <text x="490" y="113" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">User (question)</text>

  <line x1="490" y1="131" x2="490" y2="160" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Streamlit -->
  <rect x="360" y="160" width="260" height="52" rx="10" fill="#ff4b4b"/>
  <text x="490" y="182" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">Streamlit Frontend</text>
  <text x="490" y="200" text-anchor="middle" font-size="11" fill="#ffe3e3">Chat UI · Plotly charts · Clear chat</text>

  <line x1="490" y1="212" x2="490" y2="241" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FastAPI -->
  <rect x="360" y="241" width="260" height="52" rx="10" fill="#059669"/>
  <text x="490" y="263" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">FastAPI Backend</text>
  <text x="490" y="281" text-anchor="middle" font-size="11" fill="#d1fae5">POST /chat · GET /health</text>

  <line x1="490" y1="293" x2="490" y2="322" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- chat_handler -->
  <rect x="320" y="322" width="340" height="52" rx="10" fill="#1d4ed8"/>
  <text x="490" y="344" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">chat_handler.handle()</text>
  <text x="490" y="362" text-anchor="middle" font-size="11" fill="#dbeafe">Orchestrates the full pipeline</text>

  <!-- schema + history side inputs -->
  <rect x="40" y="322" width="220" height="52" rx="10" fill="#7c3aed"/>
  <text x="150" y="344" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">schema_loader</text>
  <text x="150" y="362" text-anchor="middle" font-size="10" fill="#ede9fe">Verified Busy schema annotation</text>
  <line x1="260" y1="348" x2="320" y2="348" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="720" y="322" width="220" height="52" rx="10" fill="#7c3aed"/>
  <text x="830" y="344" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">history.get_history()</text>
  <text x="830" y="362" text-anchor="middle" font-size="10" fill="#ede9fe">Last 3 turns, per session</text>
  <line x1="720" y1="348" x2="660" y2="348" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="490" y1="374" x2="490" y2="403" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Analyst <-> Critic loop box -->
  <rect x="220" y="403" width="540" height="150" rx="14" fill="#ffffff" stroke="#c7cad1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="490" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Analyst ⟷ Critic loop (max 3 iterations)</text>

  <rect x="250" y="440" width="220" height="52" rx="10" fill="#d97706"/>
  <text x="360" y="462" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Analyst Agent</text>
  <text x="360" y="480" text-anchor="middle" font-size="10" fill="#fef3c7">Question → SQL + chart spec</text>

  <rect x="510" y="440" width="220" height="52" rx="10" fill="#0891b2"/>
  <text x="620" y="462" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Critic Agent</text>
  <text x="620" y="480" text-anchor="middle" font-size="10" fill="#cffafe">Reviews correctness &amp; safety</text>

  <line x1="470" y1="466" x2="510" y2="466" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M510,478 C 480,505 440,505 470,478" stroke="#5b6472" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="490" y="518" text-anchor="middle" font-size="10" fill="#9ca3af">revise (feedback loop)</text>

  <line x1="490" y1="553" x2="490" y2="582" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sql_guard -->
  <rect x="300" y="582" width="380" height="56" rx="10" fill="#be123c"/>
  <text x="490" y="604" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">sql_guard.validate_sql()</text>
  <text x="490" y="622" text-anchor="middle" font-size="10" fill="#ffe4e6">SELECT-only · blocklist · TOP cap · WITH (NOLOCK)</text>

  <line x1="490" y1="638" x2="490" y2="667" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- query executor -->
  <rect x="300" y="667" width="380" height="56" rx="10" fill="#4338ca"/>
  <text x="490" y="689" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">query_executor.execute_query()</text>
  <text x="490" y="707" text-anchor="middle" font-size="10" fill="#e0e7ff">10s connect · 15s lock · 30s statement timeout</text>

  <line x1="490" y1="723" x2="490" y2="752" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQL Server -->
  <rect x="330" y="752" width="320" height="60" rx="10" fill="#111827"/>
  <text x="490" y="777" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">SQL Server — Busy DB</text>
  <text x="490" y="796" text-anchor="middle" font-size="10" fill="#9ca3af">chatbot_reader (db_datareader, read-only)</text>

  <line x1="330" y1="782" x2="150" y2="782" stroke="#5b6472" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="150" y1="782" x2="150" y2="812" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="812" width="220" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="150" y="840" text-anchor="middle" font-size="11" fill="#374151">Busy Accounting Software</text>

  <!-- Response back up -->
  <path d="M650,782 C 850,782 850,300 620,270" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="860" y="530" text-anchor="middle" font-size="10" fill="#059669" transform="rotate(90 860 530)">SQL + data + chart_spec</text>

  <!-- Evaluation harness box -->
  <rect x="700" y="600" width="240" height="120" rx="10" fill="#ffffff" stroke="#c7cad1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="820" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">evaluation/</text>
  <text x="820" y="642" text-anchor="middle" font-size="10" fill="#6b7280">golden_dataset.json</text>
  <text x="820" y="659" text-anchor="middle" font-size="10" fill="#6b7280">run_eval.py → chat_handler</text>
  <text x="820" y="676" text-anchor="middle" font-size="10" fill="#6b7280">judge_agent.py (schema-grounded)</text>
  <text x="820" y="693" text-anchor="middle" font-size="10" fill="#6b7280">8/8 · 100% semantic accuracy</text>
  <line x1="700" y1="660" x2="660" y2="620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
